[package]
name = "task-dock"
version = "0.3.0"
description = "Task Dock — Windows 桌面悬浮任务与 AI Agent 监控中心"
authors = ["Task Dock contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "task_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 直接依赖 window-vibrancy（与 tauri 的 Windows 传递依赖同版本，零新增 crate）：
# Tauri 原生 set_effects 在 Windows 上吞错（恒 Ok），无法判断毛玻璃是否真正生效
window-vibrancy = "0.6"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
