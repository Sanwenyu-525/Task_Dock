[package]
name = "task-dock"
version = "0.5.0"
description = "Task Dock — Windows 桌面悬浮任务与 AI Agent 监控中心"
authors = ["Task Dock contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "task_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
# 直接依赖 window-vibrancy（与 tauri 的 Windows 传递依赖同版本，零新增 crate）：
# Tauri 原生 set_effects 在 Windows 上吞错（恒 Ok），无法判断毛玻璃是否真正生效
window-vibrancy = "0.6"
tauri-plugin-notification = "2"
# 桌面通知直连 WinRT（Cargo.lock 已有传递依赖，版本对齐）：
# notify-rust 每条 toast 都会注册 on_activated/on_dismissed 回调，Toast 在操作中心
# 存续期间这些 COM 回调把 ~3 个句柄和 ~23KB 原生内存留在本进程；改为无回调直发
# toast，消除按条累积（压测证据见 docs/PERFORMANCE_FINAL_ACCEPTANCE.md §14）。
tauri-winrt-notification = "0.8"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# raw_value：分块备份的 section 行按原始 JSON 文本落盘，省掉中间 Value 树
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
# 本地 HTTP 接入（异步、有并发上限、可超时）：与 Cargo.lock 现有传递依赖同主版本
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
bytes = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
# 智能剪贴板：PNG 编解码 / 内容哈希 / HTML data URI（均为 Cargo.lock 已有传递依赖，版本对齐）
png = "0.18"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.23"
# 手机同步 v1：载荷加密。XSalsa20-Poly1305 与手机端 tweetnacl secretbox 同一算法，
# 密钥由设备令牌哈希经 SHA-512 派生（见 mobile_sync::sync）；nonce 走 OS 随机源。
xsalsa20poly1305 = "0.9"
rand = "0.8"
# 手机同步 v2：传输层硬切 TLS。服务端用系统 schannel（native-tls），不引入
# ring/aws-lc-rs（本机构建无 nasm/cmake）。自签证书用纯 Rust 的 rsa + x509-cert
# 生成（RSA-3072 + SHA-256 签名）：native-tls 的 Windows 后端经 legacy CryptoAPI
# 导入私钥，不支持 EC 密钥，因此不能用 ECDSA P-256；SPKI SHA-256 指纹进二维码
# 供手机端固定，指纹语义与算法无关。
native-tls = "0.2"
tokio-native-tls = "0.3"
rsa = { version = "0.9", features = ["pem", "sha2"] }
x509-cert = { version = "0.2", default-features = false, features = ["builder", "pem"] }
# 自定义语音包导入校验：纯 Rust 完整解码 MP3/WAV，不启用播放后端或其他媒体格式。
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "pcm"] }
# 导航系统（v0.4）：窗口枚举/焦点控制（与 window-vibrancy 传递依赖同主版本，零新增二进制）
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  # 拖拽磁力（v0.7）：按窗口 DPI 换算 CSS 参数（GetDpiForWindow）
  "Win32_UI_HiDpi",
  # 右键菜单（v0.6 整改）：EVENT_SYSTEM_FOREGROUND 钩子（事件驱动的菜单外点击关闭）
  "Win32_UI_Accessibility",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  # Android 虚拟屏 MVP：scrcpy 子进程加入 Job Object，task_dock 退出时一并回收
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Graphics_Dwm",
  # 智能剪贴板（v0.5）：剪贴板读写/监听、全局内存、隐藏消息窗口、进程令牌
  "Win32_System_DataExchange",
  "Win32_System_Ole",
  # 资源管理（v0.14）：GlobalMemoryStatusEx 物理内存采样（kernel32）
  "Win32_System_SystemInformation",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  # 真实应用图标：SHGetFileInfoW / ExtractIconExW（shell32）
  "Win32_UI_Shell",
  # Agent Hooks 配置写入：MoveFileExW 原子替换（MOVEFILE_REPLACE_EXISTING | WRITE_THROUGH）
  "Win32_Storage_FileSystem",
  # 手机接入局域网地址枚举（v0.16.1）：GetAdaptersAddresses 枚举单播 IPv4，
  # 替代默认路由 UDP 探测（TUN fake-ip 198.18.0.0/15 会误选虚拟网卡地址）。
  # 仅追加 feature：IpHelper 为 API 本体；WinSock 是 SOCKET_ADDRESS/SOCKADDR；
  # Ndis 是 IP_ADAPTER_ADDRESSES_LH 结构的 cfg 门控必需项（OperStatus/Luid 字段）。
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_NetworkManagement_Ndis",
] }
# Windows Shell COM（仅图标链路用）：IShellLinkW 解析 .lnk 真实目标、
# IShellItemImageFactory 取 UWP 包图标。版本与 Cargo.lock 现有传递依赖一致（无新增下载）。
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  # OLE 拖出读回 CF_HDROP 用 STGMEDIUM（STGMEDIUM 受 StructuredStorage 门控）
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell",
  # 文件暂存架拖出（v0.9）：OLE DoDragDrop + CF_HDROP 全局内存
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Memory",
  "Win32_UI_Shell_Common",
  # 轻量本地 OCR（v0.6）：Windows.Media.Ocr + SoftwareBitmap（按需创建，不在启动时初始化）
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  # 本地语音播报（WinRT SpeechSynthesis）：枚举系统语音、异步合成取 WAV 流。
  # 与 OCR 共用同一 windows/0.62 版本，Media_Core 提供 SpeechSynthesisStream。
  "Media_Core",
  "Media_SpeechSynthesis",
  # 快速捕获语音输入（WinRT SpeechRecognizer 听写模式）：与 TTS 同一 windows crate，
  # 只启用模块 feature，不新增依赖下载（windows-collections 已在 Cargo.lock）。
  "Media_SpeechRecognition",
] }
# `#[implement]` 宏展开需要 windows_core 直接可达；与 windows 0.62 同版本，
# 已存在于 Cargo.lock（tao/wry 传递依赖），不是新增下载。
windows-core = "0.62"
# WinRT 异步操作的状态轮询与结果读取（OCR 用；与 windows 的传递依赖同版本，无新增下载）
windows-future = "0.3"
# 注册表读取（卸载信息 / UWP 包注册）
winreg = "0.55"
# 开始菜单 .lnk 快捷方式解析（纯 Rust 实现；个别畸形 lnk 会 panic，
# 调用方以 catch_unwind 隔离，坏文件跳过不影响扫描）
lnk = "0.5"

# 开发构建的 PDB 体积控制（2026-11-05）：完整调试信息让 target/debug 下的 .pdb
# 膨胀到 15 GiB 级别。line-tables-only 只保留文件/行号表（崩溃栈仍可定位到文件和行），
# 不生成类型/局部变量/内联信息，显著压缩 PDB。需要完整变量时临时覆盖：
# CARGO_PROFILE_DEV_DEBUG=2 cargo build（见 docs/DEVELOPMENT.md 第七章）。
[profile.dev]
debug = "line-tables-only"

# 注意：不得设置 panic = "abort" —— 导航扫描依赖 catch_unwind 隔离畸形 .lnk 的
# 解析 panic（真机验收发现：panic=abort 下 catch_unwind 失效，扫描到用户开始
# 菜单中的异常快捷方式会让整个应用直接退出）。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
