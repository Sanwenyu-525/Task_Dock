<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- TaskDock 投屏窗口专属图标（源图）：白色圆角底 + 深蓝显示器 + 手机 + 蓝色投屏弧线。
       与主程序图标同品牌语言（同色板/同形态比例），但构图不同，任务栏可区分。
       多尺寸 ICO 由 icons/projection.ico 承载（16/20/24/32/40/48/64/128/256）。 -->
  <defs>
    <style>
      .frame { fill: #1e3a5f; }
      .screen { fill: #d6e6f7; }
      .wave { fill: #b9d4ee; }
      .cast { fill: none; stroke: #1f7ae0; stroke-width: 44; stroke-linecap: round; }
      .phone-body { fill: #1e3a5f; }
      .phone-screen { fill: #ffffff; }
      .phone-wave { fill: #d6e6f7; }
    </style>
  </defs>

  <!-- 白色圆角底 -->
  <rect x="48" y="48" width="928" height="928" rx="208" ry="208" fill="#f4f7fb"/>
  <rect x="48" y="48" width="928" height="928" rx="208" ry="208" fill="none" stroke="#e2eaf3" stroke-width="8"/>

  <!-- 显示器（右） -->
  <path class="frame" d="M300 190 h480 a88 88 0 0 1 88 88 v380 a88 88 0 0 1 -88 88 h-360 v72 h70 a34 34 0 0 1 0 68 h-240 a34 34 0 0 1 0 -68 h70 v-72 h-32 a88 88 0 0 1 -88 -88 v-380 a88 88 0 0 1 88 -88 z"/>
  <rect class="screen" x="330" y="222" width="508" height="368" rx="52"/>
  <path class="wave" d="M330 520 c90 -90 200 -60 280 -110 c70 -44 130 -40 228 -12 v128 a52 52 0 0 1 -52 52 h-404 a52 52 0 0 1 -52 -52 z"/>

  <!-- 手机（左） -->
  <rect class="phone-body" x="120" y="392" width="176" height="360" rx="56"/>
  <rect class="phone-screen" x="146" y="418" width="124" height="308" rx="34"/>
  <rect class="phone-screen" x="146" y="430" width="124" height="22" rx="11" fill="#1f7ae0"/>
  <path class="phone-wave" d="M146 640 c30 -26 60 -18 84 -34 c22 -14 40 -12 40 -12 v132 a34 34 0 0 1 -34 34 h-56 a34 34 0 0 1 -34 -34 z"/>

  <!-- 投屏弧线（中） -->
  <path class="cast" d="M436 568 a118 118 0 0 1 60 -104"/>
  <path class="cast" d="M470 618 a170 170 0 0 1 88 -152"/>
</svg>
