<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Dock · 工作台</title>
    <script>
      /* 主题提示读取器（与 index.html、src/workspace/main.tsx 使用同一个
         localStorage 键）：设置尚未从 SQLite 读取前先套用上次解析结果，
         避免启动占位先闪一帧错误主题。白名单校验，无效或缺失保持 html 默认。 */
      (function () {
        try {
          var hint = JSON.parse(localStorage.getItem("taskdock.boot-theme") || "null");
          var hintTheme = hint && hint.theme;
          var hintPreset = hint && hint.preset;
          if (hintTheme === "light" || hintTheme === "dark") document.documentElement.dataset.theme = hintTheme;
          if (hintPreset === "frosted" || hintPreset === "dream-gradient") document.documentElement.dataset.preset = hintPreset;
        } catch (e) {
          /* 读取/解析失败：按无提示处理，走 html 默认主题 */
        }
      })();
    </script>
    <style>
      /* 工作台窗口启动占位（2026-11-17）：
         契约 docs/boot/README.md §2/§3/§6。状态机由 public/boot/boot-watchdog.js
         驱动（与主窗口同一份看门狗，单一事实源）：
           boot（正在恢复工作台）→ slow（加载稍久）→ timeout/error（恢复卡）
         ready 后由 src/boot/bootProtocol.ts 的 bootReady 淡出移除。
         为什么需要：工作台窗口是隐藏创建、8s 仍未就绪时强制显示（见
         project_workspace_window.rs）。此前 workspace.html 只有一个 #root，
         React 未挂载期间窗口是纯白，主线程被堵时用户只看到标题栏的「(未响应)」，
         没有任何「正在启动 / 加载超时 / 重新加载」的提示。 */

      /* ── 占位自有 Token：预 React 阶段拿不到应用语义 Token，取值与
         index.html 的 --boot-* 保持一致（浅色/深色 × 两预设，共 4+4 组）。 ── */
      :root {
        --boot-bg: #f4f5f7;
        --boot-fg: #4b5563;
        --boot-strong: #232840;
        --boot-surface: #ffffff;
        --boot-border: rgba(35, 40, 64, 0.12);
        --boot-border-strong: rgba(35, 40, 64, 0.2);
        --boot-accent: #4f46e5;
        --boot-accent-gradient: linear-gradient(135deg, #4f46e5 0%, #4338ca 55%, #6d28d9 100%);
        --boot-accent-soft: rgba(79, 70, 229, 0.1);
        --boot-shadow: 0 18px 44px -20px rgba(42, 46, 96, 0.35);
      }
      html[data-theme="dark"] {
        --boot-bg: #17181c;
        --boot-fg: #c8ccd4;
        --boot-strong: #edeffa;
        --boot-surface: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.04));
        --boot-border: rgba(255, 255, 255, 0.12);
        --boot-border-strong: rgba(255, 255, 255, 0.2);
        --boot-accent: #a5a8ff;
        --boot-accent-gradient: linear-gradient(135deg, #5257ea 0%, #4f46e5 55%, #7c3aed 100%);
        --boot-accent-soft: rgba(165, 168, 255, 0.16);
        --boot-shadow: 0 18px 44px -20px rgba(2, 6, 18, 0.7);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --boot-bg: #17181c;
          --boot-fg: #c8ccd4;
          --boot-strong: #edeffa;
          --boot-surface: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.04));
          --boot-border: rgba(255, 255, 255, 0.12);
          --boot-border-strong: rgba(255, 255, 255, 0.2);
          --boot-accent: #a5a8ff;
          --boot-accent-gradient: linear-gradient(135deg, #5257ea 0%, #4f46e5 55%, #7c3aed 100%);
          --boot-accent-soft: rgba(165, 168, 255, 0.16);
          --boot-shadow: 0 18px 44px -20px rgba(2, 6, 18, 0.7);
        }
      }
      html[data-preset="frosted"] {
        --boot-bg: linear-gradient(152deg, #ffffff 0%, #f3f8fe 42%, #ebf5fc 72%, #f6fbff 100%);
        --boot-fg: #565d78;
        --boot-strong: #232840;
        --boot-surface: linear-gradient(158deg, rgba(255, 255, 255, 0.97) 0%, rgba(250, 253, 255, 0.92) 52%, rgba(240, 248, 252, 0.88) 100%);
        --boot-border: rgba(80, 104, 146, 0.2);
        --boot-border-strong: rgba(80, 104, 146, 0.32);
        --boot-accent: #4f46e5;
        --boot-accent-gradient: linear-gradient(140deg, #4f46e5 0%, #3730a3 48%, #5b21b6 100%);
        --boot-accent-soft: rgba(79, 70, 229, 0.12);
        --boot-shadow: 0 18px 44px -20px rgba(72, 82, 160, 0.45);
      }
      html[data-preset="frosted"][data-theme="dark"] {
        --boot-bg: linear-gradient(152deg, #1c2234 0%, #141a29 42%, #0f1727 72%, #0f1727 100%);
        --boot-fg: #b0b5cd;
        --boot-strong: #edeffa;
        --boot-surface: linear-gradient(158deg, rgba(72, 88, 118, 0.38) 0%, rgba(38, 50, 72, 0.44) 55%, rgba(27, 37, 55, 0.52) 100%);
        --boot-border: rgba(196, 214, 255, 0.18);
        --boot-border-strong: rgba(196, 214, 255, 0.28);
        --boot-accent: #a5a8ff;
        --boot-accent-gradient: linear-gradient(140deg, #4560e0 0%, #3730a3 48%, #5b21b6 100%);
        --boot-accent-soft: rgba(165, 168, 255, 0.16);
        --boot-shadow: 0 18px 44px -20px rgba(2, 6, 18, 0.72);
      }
      @media (prefers-color-scheme: dark) {
        html[data-preset="frosted"]:not([data-theme="light"]) {
          --boot-bg: linear-gradient(152deg, #1c2234 0%, #141a29 42%, #0f1727 72%, #0f1727 100%);
          --boot-fg: #b0b5cd;
          --boot-strong: #edeffa;
          --boot-surface: linear-gradient(158deg, rgba(72, 88, 118, 0.38) 0%, rgba(38, 50, 72, 0.44) 55%, rgba(27, 37, 55, 0.52) 100%);
          --boot-border: rgba(196, 214, 255, 0.18);
          --boot-border-strong: rgba(196, 214, 255, 0.28);
          --boot-accent: #a5a8ff;
          --boot-accent-gradient: linear-gradient(140deg, #4560e0 0%, #3730a3 48%, #5b21b6 100%);
          --boot-accent-soft: rgba(165, 168, 255, 0.16);
          --boot-shadow: 0 18px 44px -20px rgba(2, 6, 18, 0.72);
        }
      }
      html[data-preset="dream-gradient"] {
        --boot-bg: linear-gradient(158deg, #fbfcff 0%, #efeaff 34%, #fdf0f9 68%, #f5faff 100%);
        --boot-fg: #59607a;
        --boot-strong: #22263c;
        --boot-surface: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0.88) 52%, rgba(250, 248, 255, 0.84) 100%);
        --boot-border: rgba(74, 78, 148, 0.22);
        --boot-border-strong: rgba(74, 78, 148, 0.34);
        --boot-accent: #4f46e5;
        --boot-accent-gradient: linear-gradient(135deg, #4f46e5 0%, #4338ca 55%, #6d28d9 100%);
        --boot-accent-soft: rgba(99, 102, 241, 0.1);
        --boot-shadow: 0 18px 44px -20px rgba(76, 72, 160, 0.42);
      }
      html[data-preset="dream-gradient"][data-theme="dark"] {
        --boot-bg: linear-gradient(158deg, #14172a 0%, #191630 36%, #211827 68%, #121626 100%);
        --boot-fg: #a4a9c2;
        --boot-strong: #e9eaf6;
        --boot-surface: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.06) 52%, rgba(255, 255, 255, 0.045) 100%);
        --boot-border: rgba(205, 208, 255, 0.16);
        --boot-border-strong: rgba(205, 208, 255, 0.26);
        --boot-accent: #a5a8ff;
        --boot-accent-gradient: linear-gradient(135deg, #5257ea 0%, #4f46e5 55%, #7c3aed 100%);
        --boot-accent-soft: rgba(165, 168, 255, 0.16);
        --boot-shadow: 0 18px 44px -20px rgba(2, 6, 18, 0.68);
      }
      @media (prefers-color-scheme: dark) {
        html[data-preset="dream-gradient"]:not([data-theme="light"]) {
          --boot-bg: linear-gradient(158deg, #14172a 0%, #191630 36%, #211827 68%, #121626 100%);
          --boot-fg: #a4a9c2;
          --boot-strong: #e9eaf6;
          --boot-surface: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.06) 52%, rgba(255, 255, 255, 0.045) 100%);
          --boot-border: rgba(205, 208, 255, 0.16);
          --boot-border-strong: rgba(205, 208, 255, 0.26);
          --boot-accent: #a5a8ff;
          --boot-accent-gradient: linear-gradient(135deg, #5257ea 0%, #4f46e5 55%, #7c3aed 100%);
          --boot-accent-soft: rgba(165, 168, 255, 0.16);
          --boot-shadow: 0 18px 44px -20px rgba(2, 6, 18, 0.68);
        }
      }

      /* 骨架屏中性色（与 index.html 同一组取值，逐明暗/预设对齐）：
         骨架屏只在 slow/timeout 出现，颜色只跟明暗走，不引入第二套色板。 */
      :root {
        --boot-sk-base: rgba(35, 40, 64, 0.08);
        --boot-sk-card: rgba(255, 255, 255, 0.6);
        --boot-sk-shine: rgba(255, 255, 255, 0.55);
      }
      html[data-theme="dark"] {
        --boot-sk-base: rgba(255, 255, 255, 0.08);
        --boot-sk-card: rgba(255, 255, 255, 0.045);
        --boot-sk-shine: rgba(255, 255, 255, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --boot-sk-base: rgba(255, 255, 255, 0.08);
          --boot-sk-card: rgba(255, 255, 255, 0.045);
          --boot-sk-shine: rgba(255, 255, 255, 0.1);
        }
      }
      /* boot-splash-shared:begin（两宿主逐字一致，src/test/bootSplash.test.ts 锁定）
         启动占位布局契约（2026-11-24 专项）：
         ① 正常高度：`.boot-stack` 的 margin-block:auto 吸收剩余空间 → 视觉居中；
         ② 高度不足：auto 外边距收敛为 0 → 内容贴顶 + 外层纵向滚动，顶部永不被裁；
         ③ 左右留白只由 #boot-splash 的 padding 提供，恢复卡只写 width:100% + max-width；
         ④ 高度档位 430/260/200/150 只压缩装饰与非核心说明，三个恢复操作全档位保留。 */
      #boot-splash,
      #boot-splash * {
        box-sizing: border-box;
      }
      #boot-splash {
        /* 视口基准：fixed + inset:0 等于 WebView2 布局视口（已扣滚动条），
           不依赖 vh/dvh 单位——旧引擎不支持 dvh 时也不存在第二套高度口径。 */
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* 顶部对齐 + 子级 auto 外边距 = 可滚动的「安全居中」：
           justify-content:center 会在内容高于视口时把顶部裁掉。 */
        justify-content: flex-start;
        padding: clamp(10px, 3vmin, 24px);
        background: var(--boot-bg);
        color: var(--boot-fg);
        font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        scroll-padding-block: 10px;
        transition: opacity 160ms ease;
      }
      body {
        /* 淡出/移除瞬间不露出白底；React 挂载后由应用样式覆盖 */
        background: var(--boot-bg);
      }
      #boot-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      /* 居中栈：上下 6px 内边距给 focus-visible 的 2px 外扩环留出空间，
         焦点环不会被滚动容器边缘裁掉。 */
      .boot-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(10px, 2.4vh, 18px);
        width: 100%;
        padding-block: 6px;
        margin-block: auto;
      }

      /* ── 启动位（boot/slow 共用）：logo + 标题 + spinner + 状态行 ── */
      .boot-intro {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        max-width: 100%;
      }
      .boot-logo {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        background: var(--boot-accent-gradient);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          0 6px 16px -6px rgba(79, 70, 229, 0.55);
      }
      .boot-title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2px;
        color: var(--boot-strong);
        text-align: center;
      }
      .boot-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid var(--boot-accent);
        border-right-color: transparent;
        border-radius: 50%;
        opacity: 0.6;
        animation: boot-spin 900ms linear infinite;
      }
      .boot-status {
        max-width: min(340px, 100%);
        font-size: 12px;
        text-align: center;
        overflow-wrap: anywhere;
        opacity: 0.85;
      }
      /* slow 态启动位浮在骨架屏之上：给一层卡片底，状态文字不压在占位条上
         （两窗口同一套视觉，避免同一个 slow 态长出两种观感）。 */
      #boot-splash[data-state="slow"] .boot-intro {
        padding: 10px 16px;
        border-radius: 14px;
        background: var(--boot-surface);
        border: 1px solid var(--boot-border);
        box-shadow: var(--boot-shadow);
      }

      /* ── 工作区骨架屏（slow 背景；timeout 更弱）：中性形状，无假任务名/进度 ──
         两宿主共用：工作台窗口同样有 slow 态，缺骨架屏会让同一状态机在两个窗口
         表现不一致（契约 docs/boot/README.md §2）。 */
      #boot-skeleton {
        /* fixed 而不是 absolute：骨架屏是背景层，恢复卡滚动时不能跟着滚走。 */
        position: fixed;
        inset: 0;
        z-index: 1;
        display: none;
        flex-direction: column;
        gap: 16px;
        padding: 20px 24px;
        overflow: hidden;
        opacity: 0.6;
        pointer-events: none;
        transition: opacity 240ms ease;
      }
      .boot-sk-top {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        flex: none;
      }
      .boot-sk-top .boot-sk-bar {
        height: 14px;
      }
      .boot-sk-space {
        flex: 1;
      }
      .boot-sk-dot {
        position: relative;
        overflow: hidden;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--boot-sk-base);
        flex: none;
      }
      .boot-sk-main {
        display: flex;
        gap: 16px;
        flex: 1;
        min-height: 0;
      }
      .boot-sk-nav {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 64px;
        flex: none;
        padding-top: 2px;
      }
      .boot-sk-tile {
        position: relative;
        overflow: hidden;
        width: 44px;
        height: 34px;
        border-radius: 10px;
        background: var(--boot-sk-base);
        flex: none;
      }
      .boot-sk-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        min-width: 0;
      }
      .boot-sk-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 14px;
        border-radius: 13px;
        background: var(--boot-sk-card);
        border: 1px solid var(--boot-border);
      }
      .boot-sk-bar {
        position: relative;
        overflow: hidden;
        height: 12px;
        border-radius: 8px;
        background: var(--boot-sk-base);
      }
      .boot-sk-w12 { width: 12%; }
      .boot-sk-w22 { width: 22%; }
      .boot-sk-w28 { width: 28%; }
      .boot-sk-w36 { width: 36%; }
      .boot-sk-w38 { width: 38%; }
      .boot-sk-w46 { width: 46%; }
      .boot-sk-w52 { width: 52%; }
      .boot-sk-w58 { width: 58%; }
      .boot-sk-w68 { width: 68%; }
      .boot-sk-w74 { width: 74%; }
      .boot-sk-bar::after,
      .boot-sk-tile::after,
      .boot-sk-dot::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, var(--boot-sk-shine), transparent);
        animation: boot-shimmer 1800ms ease-in-out infinite;
      }
      .boot-sk-row:nth-child(2) .boot-sk-bar::after { animation-delay: 120ms; }
      .boot-sk-row:nth-child(3) .boot-sk-bar::after { animation-delay: 240ms; }
      .boot-sk-row:nth-child(4) .boot-sk-bar::after { animation-delay: 360ms; }

      /* ── 恢复卡（timeout/error 共用，文案由 state 决定） ── */
      #boot-recovery {
        position: relative;
        z-index: 3;
        display: none;
        /* 只声明 100%：左右安全留白由 #boot-splash 的 padding 负责。
           旧写法 calc(100% - 48px) 在 24px 父内距下把同一份间距扣了两次，
           400 窗口里卡片只剩约 300 宽。 */
        width: 100%;
        max-width: 420px;
      }
      .boot-card {
        display: flex;
        flex-direction: column;
        gap: 9px;
        padding: 18px 20px 16px;
        border-radius: 16px;
        background: var(--boot-surface);
        border: 1px solid var(--boot-border);
        box-shadow: var(--boot-shadow);
        /* 不裁剪：焦点环（outline-offset:2）与长文本都必须在卡片内可见 */
        overflow: visible;
      }
      .boot-card-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 9px;
        background: var(--boot-accent-soft);
        color: var(--boot-accent);
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
        flex: 0 0 auto;
      }
      .boot-card-title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--boot-strong);
        overflow-wrap: anywhere;
      }
      .boot-card-detail {
        margin: 0;
        /* 长错误信息不撑破卡片，也不用 line-clamp 丢掉内容：卡片内可滚动读完，
           「复制诊断信息」另有完整信息通道。 */
        max-height: 88px;
        font-size: 12.5px;
        line-height: 1.65;
        color: var(--boot-fg);
        overflow-y: auto;
        overflow-wrap: anywhere;
      }
      .boot-card-detail:focus-visible {
        /* Chromium 会把可滚动区域放进 Tab 序列（长错误信息因此能用键盘读完），
           这里给同色系轮廓，避免出现默认黑框。 */
        outline: 2px solid var(--boot-accent);
        outline-offset: 1px;
        border-radius: 4px;
      }
      .boot-card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .boot-card-safe {
        margin: 0;
        font-size: 11px;
        line-height: 1.6;
        color: var(--boot-fg);
        opacity: 0.85;
        overflow-wrap: anywhere;
      }

      /* ── 按钮：主按钮 accent 渐变底白字，次按钮描边（产品语言） ── */
      .boot-btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 6px 14px;
        border-radius: 9px;
        border: 1px solid transparent;
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
        /* 允许合理换行：窄卡片里长文案换行而不是被裁掉 */
        white-space: normal;
        overflow-wrap: anywhere;
        max-width: 100%;
        cursor: pointer;
        transition:
          background-color 140ms ease,
          border-color 140ms ease,
          box-shadow 140ms ease,
          filter 140ms ease;
      }
      .boot-btn:focus-visible {
        outline: 2px solid var(--boot-accent);
        outline-offset: 2px;
      }
      .boot-btn-primary {
        background: var(--boot-accent-gradient);
        color: #ffffff;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.32),
          0 4px 12px -6px rgba(79, 70, 229, 0.55);
      }
      .boot-btn-primary:hover {
        filter: brightness(1.07);
      }
      .boot-btn-ghost {
        background: transparent;
        border-color: var(--boot-border-strong);
        color: var(--boot-strong);
      }
      .boot-btn-ghost:hover {
        background: var(--boot-accent-soft);
        border-color: var(--boot-accent);
        color: var(--boot-accent);
      }

      /* ── 状态可见性（§2；watchdog 写 data-state 驱动） ── */
      .boot-when-boot,
      .boot-when-slow,
      .boot-when-timeout,
      .boot-when-error {
        display: none;
      }
      #boot-splash[data-state="boot"] .boot-when-boot { display: inline; }
      #boot-splash[data-state="slow"] .boot-when-slow { display: inline; }
      #boot-splash[data-state="timeout"] .boot-when-slow { display: inline; }
      #boot-splash[data-state="timeout"] .boot-when-timeout { display: inline; }
      #boot-splash[data-state="error"] .boot-when-error { display: inline; }
      #boot-wait,
      #boot-retry,
      #boot-copy {
        display: none;
      }
      #boot-splash[data-state="timeout"] #boot-wait { display: inline-flex; }
      #boot-splash[data-state="timeout"] #boot-retry,
      #boot-splash[data-state="error"] #boot-retry,
      #boot-splash[data-state="timeout"] #boot-copy,
      #boot-splash[data-state="error"] #boot-copy { display: inline-flex; }
      #boot-splash[data-state="slow"] #boot-skeleton { display: flex; }
      #boot-splash[data-state="timeout"] #boot-skeleton {
        display: flex;
        opacity: 0.32;
      }
      #boot-splash[data-state="error"] #boot-skeleton { display: none; }
      #boot-splash[data-state="timeout"] #boot-recovery,
      #boot-splash[data-state="error"] #boot-recovery {
        display: block;
        animation: boot-rise 220ms ease-out;
      }
      /* timeout/error 时恢复卡自带全部信息，启动位让位 */
      #boot-splash[data-state="timeout"] .boot-intro,
      #boot-splash[data-state="error"] .boot-intro {
        display: none;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-shimmer {
        to {
          transform: translateX(100%);
        }
      }
      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── 减少动态效果（§7；2026-11-24 收紧为「静态状态反馈」） ──
         reduce 下没有持续旋转、没有骨架屏流光、没有位移动画：状态只由文案与
         静态形状（缺角圆环、中性色块）表达。 */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        #boot-skeleton,
        .boot-btn {
          transition: none;
        }
        .boot-spinner {
          animation: none;
        }
        .boot-sk-bar::after,
        .boot-sk-tile::after,
        .boot-sk-dot::after {
          animation: none;
          opacity: 0;
        }
        /* 与状态规则同特异性、后置：压掉 boot-rise 位移 */
        #boot-splash[data-state="timeout"] #boot-recovery,
        #boot-splash[data-state="error"] #boot-recovery {
          animation: none;
        }
      }

      /* ── 窄窗（≤400px）：卡片与骨架屏跟随收缩，左右留白由容器 padding 负责 ── */
      @media (max-width: 400px) {
        .boot-card {
          padding: 16px;
        }
        #boot-skeleton {
          gap: 12px;
          padding: 14px 16px;
        }
        .boot-sk-nav {
          width: 48px;
        }
        .boot-sk-tile {
          width: 36px;
          height: 30px;
        }
        .boot-sk-row {
          padding: 10px 12px;
        }
        .boot-btn {
          padding: 6px 12px;
        }
      }

      /* ── 短高度档位（264×112 是真实可达的窗口下限，不能假设启动窗口够高） ──
         档位只压缩装饰与非核心说明；三个恢复操作在所有档位都保留，必要时换行
         或改横向紧凑布局，绝不靠隐藏按钮腾空间。 */
      @media (max-height: 430px) {
        .boot-stack { gap: 10px; }
        .boot-intro { gap: 7px; }
        .boot-logo { width: 26px; height: 26px; border-radius: 9px; }
        .boot-title { font-size: 13px; }
        .boot-spinner { width: 13px; height: 13px; }
        .boot-status { font-size: 11.5px; }
        .boot-card { gap: 7px; padding: 14px 16px; border-radius: 14px; }
        .boot-card-badge { width: 22px; height: 22px; border-radius: 7px; font-size: 12px; }
        .boot-card-title { font-size: 14px; }
        .boot-card-detail { font-size: 12px; line-height: 1.55; }
        .boot-card-safe { font-size: 10.5px; }
        .boot-btn { min-height: 30px; padding: 5px 12px; }
      }

      /* 档位 2（≤260px）：徽标让位（纯装饰 aria-hidden），操作紧跟标题 */
      @media (max-height: 260px) {
        .boot-card { gap: 6px; padding: 11px 13px 12px; }
        .boot-card-badge { display: none; }
        .boot-card-title { font-size: 13.5px; }
        .boot-card-actions { order: 1; gap: 6px; }
        .boot-card-detail { order: 2; max-height: 44px; }
        .boot-card-safe { display: none; }
        .boot-sk-top { height: 30px; }
        .boot-sk-tile { width: 30px; height: 24px; border-radius: 8px; }
      }

      /* 档位 3（≤200px，含 280×140）：启动位转横向紧凑；骨架屏简化 */
      @media (max-height: 200px) {
        #boot-splash { padding: 8px; }
        .boot-stack { gap: 8px; padding-block: 4px; }
        .boot-intro {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          gap: 8px;
        }
        .boot-logo { width: 20px; height: 20px; border-radius: 7px; }
        .boot-title { font-size: 12px; }
        .boot-spinner { width: 12px; height: 12px; }
        .boot-status { font-size: 11px; }
        #boot-splash[data-state="slow"] .boot-intro { padding: 5px 10px; border-radius: 9px; }
        .boot-card { gap: 5px; padding: 8px 10px; border-radius: 11px; }
        .boot-card-title { font-size: 12.5px; }
        .boot-card-detail { max-height: 34px; font-size: 11px; line-height: 1.45; }
        .boot-btn { min-height: 26px; padding: 4px 10px; font-size: 11.5px; }
        #boot-skeleton { gap: 8px; padding: 10px 12px; }
        .boot-sk-top { height: 24px; gap: 6px; }
        .boot-sk-list { gap: 8px; }
        .boot-sk-row { gap: 6px; padding: 8px 10px; }
        .boot-sk-nav { display: none; }
        .boot-sk-row:nth-child(3),
        .boot-sk-row:nth-child(4) { display: none; }
      }

      /* 档位 4（≤150px，264×112 下限）：按钮再收一档，三个操作同屏可见 */
      @media (max-height: 150px) {
        .boot-card-title { font-size: 12px; }
        .boot-btn { min-height: 24px; padding: 3px 8px; font-size: 11px; }
        .boot-card-detail { max-height: 26px; }
        .boot-status { font-size: 10.5px; }
      }
      /* boot-splash-shared:end */
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" data-state="boot">
      <div class="boot-skeleton" id="boot-skeleton" aria-hidden="true">
        <div class="boot-sk-top">
          <span class="boot-sk-bar boot-sk-w22"></span>
          <span class="boot-sk-bar boot-sk-w12"></span>
          <span class="boot-sk-space"></span>
          <span class="boot-sk-dot"></span>
          <span class="boot-sk-dot"></span>
        </div>
        <div class="boot-sk-main">
          <div class="boot-sk-nav">
            <span class="boot-sk-tile"></span>
            <span class="boot-sk-tile"></span>
            <span class="boot-sk-tile"></span>
            <span class="boot-sk-tile"></span>
            <span class="boot-sk-tile"></span>
            <span class="boot-sk-tile"></span>
          </div>
          <div class="boot-sk-list">
            <div class="boot-sk-row">
              <span class="boot-sk-bar boot-sk-w68"></span>
              <span class="boot-sk-bar boot-sk-w36"></span>
            </div>
            <div class="boot-sk-row">
              <span class="boot-sk-bar boot-sk-w46"></span>
              <span class="boot-sk-bar boot-sk-w58"></span>
            </div>
            <div class="boot-sk-row">
              <span class="boot-sk-bar boot-sk-w74"></span>
              <span class="boot-sk-bar boot-sk-w28"></span>
            </div>
            <div class="boot-sk-row">
              <span class="boot-sk-bar boot-sk-w38"></span>
              <span class="boot-sk-bar boot-sk-w52"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="boot-stack">
        <div class="boot-intro">
          <div class="boot-logo" aria-hidden="true"></div>
          <div class="boot-title">Task Dock 工作台</div>
          <div class="boot-spinner" aria-hidden="true"></div>
          <div class="boot-status" id="boot-status">
            <span class="boot-when-boot">正在恢复工作台…</span>
            <span class="boot-when-slow">正在加载工作台界面，首次启动可能需要稍久…</span>
          </div>
        </div>
        <div class="boot-recovery" id="boot-recovery">
          <div class="boot-card">
            <div class="boot-card-badge" aria-hidden="true">!</div>
            <div class="boot-card-title">
              <span class="boot-when-timeout">工作台启动超时</span>
              <span class="boot-when-error">工作台启动遇到问题</span>
            </div>
            <p class="boot-card-detail" id="boot-detail">
              <span class="boot-when-timeout">工作台界面加载比预期慢。可以继续等待，或重新加载。</span>
              <span class="boot-when-error">工作台界面加载遇到问题。</span>
            </p>
            <div class="boot-card-actions">
              <button type="button" class="boot-btn boot-btn-primary" id="boot-wait">继续等待</button>
              <button type="button" class="boot-btn boot-btn-ghost" id="boot-retry">重新加载</button>
              <button type="button" class="boot-btn boot-btn-ghost" id="boot-copy">复制诊断信息</button>
            </div>
            <p class="boot-card-safe">工作台只是显示层：继续等待或重新加载都不会修改任务与项目数据；若窗口长时间没有响应，可关闭后重新启动 Task Dock。</p>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <!-- 启动看门狗：public/boot/boot-watchdog.js（经典脚本，先于模块入口执行）。
         与主窗口共用同一份状态机；工作台入口在 src/boot/bootProtocol.ts 的
         bootReady 处确认就绪（WorkbenchShell 设置落定后）。
         入口链：boot-watchdog.js → bootstrap.ts → 动态 import main.tsx。 -->
    <script src="/boot/boot-watchdog.js"></script>
    <script>
      /* 死人在场保险（与 index.html 同规则）：watchdog 文件缺失/未执行时，
         20s 后仍无 window.__TASK_DOCK_BOOT__ 就强制淡出并移除占位，绝不永久遮挡。 */
      setTimeout(function () {
        if (window.__TASK_DOCK_BOOT__) return;
        var splash = document.getElementById("boot-splash");
        if (!splash || !splash.parentNode) return;
        splash.classList.add("is-leaving");
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 200);
      }, 20000);
    </script>
    <script>
      /* 恢复卡出现（timeout/error）时根元素 role 切 alert、播报加强；
         回到 boot/slow 时还原 status/polite。watchdog 只写 data-state。 */
      (function () {
        var splash = document.getElementById("boot-splash");
        if (!splash || typeof MutationObserver !== "function") return;
        new MutationObserver(function () {
          var alertMode =
            splash.getAttribute("data-state") === "timeout" ||
            splash.getAttribute("data-state") === "error";
          splash.setAttribute("role", alertMode ? "alert" : "status");
          splash.setAttribute("aria-live", alertMode ? "assertive" : "polite");
        }).observe(splash, { attributes: true, attributeFilter: ["data-state"] });
      })();
    </script>
    <!-- 启动入口：bootstrap.ts（极轻量，零业务依赖）。它先记录 bootstrap-start，
         再动态 import("./main") 加载真正入口；import 卡住/失败/CSP 拦截都能被
         watchdog 的资源与导入状态采样定位。此前直接加载 main.tsx 时，整个静态
         依赖图未解析完就没有任何阶段信号，只能看到「模块脚本尚未执行」。 -->
    <script type="module" src="/src/workspace/bootstrap.ts"></script>
  </body>
</html>
