<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskDock 收集箱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Roboto Flex"', 'sans-serif'],
          },
          colors: {
            'canvas': '#F3F5FA',
            'surface': '#FFFFFF',
            'recessed': '#E9EEF8',
            'charcoal': '#121826',
            'slate-mute': '#5B6478',
            'faint-steel': '#8A93A6',
            'hairline': '#E4E8F0',
            'signal-blue': '#3A5BEF',
            'soft-blue': '#E8ECFE',
            'danger-red': '#C0332B',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Roboto Flex', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #F3F5FA;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 20;
    }
  </style>
</head>
<body class="bg-canvas text-charcoal flex justify-center min-h-screen">
  <!-- Mobile Container (390dp equivalent) -->
  <div class="w-full max-w-[390px] min-h-screen bg-canvas flex flex-col relative pb-[104px]">
    
    <!-- Android Status Bar -->
    <header class="w-full h-10 px-4 flex justify-between items-center text-charcoal text-[13px] font-semibold select-none pt-1">
      <span>09:41</span>
      <div class="flex items-center gap-1.5 text-charcoal">
        <span class="material-symbols-outlined text-[17px] leading-none">signal_cellular_4_bar</span>
        <span class="material-symbols-outlined text-[17px] leading-none">wifi</span>
        <span class="material-symbols-outlined text-[18px] leading-none">battery_full</span>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="px-4 pt-3 flex flex-col gap-3">
      
      <!-- Top Title Area -->
      <section class="flex flex-col gap-1">
        <h1 class="text-[30px] font-extrabold text-charcoal leading-[36px] tracking-[-0.02em]">收集箱</h1>
        <p class="text-[12px] font-normal text-slate-mute leading-[16px]">6 条速记 · 仅本机保存</p>
      </section>

      <!-- Quick Capture Area -->
      <section class="bg-surface rounded-[20px] border border-hairline p-3 flex flex-col gap-2.5">
        <div class="h-11 bg-recessed rounded-[12px] px-3 flex items-center justify-between gap-2">
          <input 
            type="text" 
            placeholder="随手记一条…" 
            class="bg-transparent text-[13px] text-charcoal placeholder-slate-mute/70 outline-none w-full font-normal leading-[19px]"
          />
          <button class="bg-signal-blue text-white text-[12px] font-semibold px-3.5 py-1.5 rounded-[12px] shrink-0 active:scale-95 transition-transform">
            记下
          </button>
        </div>
        <div class="text-[12px] font-normal text-faint-steel px-1">
          回车保存 · 不需要切换页面
        </div>
      </section>

      <!-- Search Field -->
      <section class="h-11 bg-recessed rounded-[12px] px-3 flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px] text-slate-mute leading-none">search</span>
        <input 
          type="text" 
          placeholder="搜索收集箱" 
          class="bg-transparent text-[13px] text-charcoal placeholder-slate-mute/70 outline-none w-full font-normal leading-[19px]"
        />
      </section>

      <!-- Capture Card List -->
      <section class="flex flex-col gap-2.5 pt-0.5">
        
        <!-- Card 1 -->
        <article class="bg-surface rounded-[16px] border border-hairline p-3 flex flex-col gap-2.5">
          <p class="text-[13px] font-normal text-charcoal leading-[19px]">
            看到一句话：计划要短，执行要稳。
          </p>
          <div class="flex items-center justify-between pt-1 border-t border-hairline/60">
            <span class="text-[12px] font-normal text-slate-mute">2 分钟前</span>
            <div class="flex items-center gap-4">
              <button class="text-[12px] font-medium text-signal-blue active:opacity-75 transition-opacity">
                转任务
              </button>
              <button class="text-[12px] font-medium text-danger-red active:opacity-75 transition-opacity">
                删除
              </button>
            </div>
          </div>
        </article>

        <!-- Card 2 -->
        <article class="bg-surface rounded-[16px] border border-hairline p-3 flex flex-col gap-2.5">
          <p class="text-[13px] font-normal text-charcoal leading-[19px] break-words">
            <a href="https://stitch.withgoogle.com" target="_blank" rel="noopener noreferrer" class="text-signal-blue underline decoration-signal-blue/50 underline-offset-2">https://stitch.withgoogle.com</a> 有空研究一下「用 AI 出原型」
          </p>
          <div class="flex items-center justify-between pt-1 border-t border-hairline/60">
            <span class="text-[12px] font-normal text-slate-mute">1 小时前</span>
            <div class="flex items-center gap-4">
              <button class="text-[12px] font-medium text-signal-blue active:opacity-75 transition-opacity">
                转任务
              </button>
              <button class="text-[12px] font-medium text-danger-red active:opacity-75 transition-opacity">
                删除
              </button>
            </div>
          </div>
        </article>

        <!-- Card 3 -->
        <article class="bg-surface rounded-[16px] border border-hairline p-3 flex flex-col gap-2.5">
          <p class="text-[13px] font-normal text-charcoal leading-[19px]">
            报销单要贴发票原件，财务说下周三之前。
          </p>
          <div class="flex items-center justify-between pt-1 border-t border-hairline/60">
            <span class="text-[12px] font-normal text-slate-mute">昨天 18:20</span>
            <div class="flex items-center gap-4">
              <button class="text-[12px] font-medium text-signal-blue active:opacity-75 transition-opacity">
                转任务
              </button>
              <button class="text-[12px] font-medium text-danger-red active:opacity-75 transition-opacity">
                删除
              </button>
            </div>
          </div>
        </article>

        <!-- Card 4 -->
        <article class="bg-surface rounded-[16px] border border-hairline p-3 flex flex-col gap-2.5">
          <p class="text-[13px] font-normal text-charcoal leading-[19px]">
            体检预约：空腹，早上 8:30 到前台取号。
          </p>
          <div class="flex items-center justify-between pt-1 border-t border-hairline/60">
            <span class="text-[12px] font-normal text-slate-mute">昨天 09:12</span>
            <div class="flex items-center gap-4">
              <button class="text-[12px] font-medium text-signal-blue active:opacity-75 transition-opacity">
                转任务
              </button>
              <button class="text-[12px] font-medium text-danger-red active:opacity-75 transition-opacity">
                删除
              </button>
            </div>
          </div>
        </article>

      </section>

    </main>

    <!-- Floating Rounded Tab Bar (64dp tall, inset 16dp) -->
    <nav class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-[358px] h-16 bg-surface border border-hairline rounded-[24px] flex items-center justify-around px-2 z-40 select-none">
      
      <!-- Tab 1: 任务 -->
      <button class="flex-1 flex flex-col items-center justify-center py-1 text-slate-mute active:scale-95 transition-transform">
        <span class="material-symbols-outlined text-[22px]">check_circle</span>
        <span class="text-[11px] font-semibold tracking-[0.02em] mt-0.5">任务</span>
      </button>

      <!-- Tab 2: 收集箱 (Active with blue pill indicator) -->
      <button class="flex-1 flex flex-col items-center justify-center py-1 active:scale-95 transition-transform">
        <div class="bg-soft-blue px-3.5 py-1 rounded-[16px] flex items-center justify-center">
          <span class="material-symbols-outlined fill-1 text-[22px] text-signal-blue">inbox</span>
        </div>
        <span class="text-[11px] font-bold text-signal-blue tracking-[0.02em] mt-0.5">收集箱</span>
      </button>

      <!-- Tab 3: 笔记 -->
      <button class="flex-1 flex flex-col items-center justify-center py-1 text-slate-mute active:scale-95 transition-transform">
        <span class="material-symbols-outlined text-[22px]">description</span>
        <span class="text-[11px] font-semibold tracking-[0.02em] mt-0.5">笔记</span>
      </button>

      <!-- Tab 4: 设置 -->
      <button class="flex-1 flex flex-col items-center justify-center py-1 text-slate-mute active:scale-95 transition-transform">
        <span class="material-symbols-outlined text-[22px]">settings</span>
        <span class="text-[11px] font-semibold tracking-[0.02em] mt-0.5">设置</span>
      </button>

    </nav>

  </div>
</body>
</html>
