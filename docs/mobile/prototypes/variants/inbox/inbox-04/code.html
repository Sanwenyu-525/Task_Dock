<body class="bg-background text-on-surface antialiased min-h-screen flex justify-center selection:bg-primary-container selection:text-primary">
<!-- Mobile Viewport Frame (390dp max-w standard portrait) -->
<div class="w-full max-w-[390px] min-h-screen bg-background relative flex flex-col pb-[104px]">
<!-- 1. Android Status Bar -->
<header class="w-full h-8 px-5 pt-2 flex items-center justify-between text-on-surface select-none">
<span class="font-meta text-[13px] font-semibold tracking-tight text-on-surface">09:41</span>
<div class="flex items-center space-x-1.5 text-on-surface">
<span class="material-symbols-outlined text-[15px]" data-icon="network_cell">network_cell</span>
<span class="material-symbols-outlined text-[15px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[16px]" data-icon="battery_full">battery_full</span>
</div>
</header>
<!-- 2. Header Area -->
<section class="px-margin pt-3 pb-3">
<h1 class="font-display text-display text-[#121826]">收集箱</h1>
<p class="font-meta text-meta text-on-surface-variant mt-0.5">6 条速记 · 仅本机保存</p>
</section>
<!-- Main Content Container -->
<main class="px-margin space-y-3 flex-1">
<!-- 3. Quick Capture Card -->
<section class="bg-surface rounded-[20px] border border-outline p-4">
<div class="h-[44px] bg-surface-container rounded-[12px] flex items-center justify-between px-3 focus-within:ring-1 focus-within:ring-primary focus-within:bg-surface">
<input class="w-full bg-transparent border-0 p-0 font-body text-body text-[#121826] placeholder:text-on-surface-faint focus:ring-0 focus:outline-none" placeholder="随手记一条…" type="text"/>
<button class="ml-2 flex-shrink-0 bg-primary text-white font-meta text-meta font-semibold rounded-[12px] py-1.5 px-3 active:scale-95 transition-transform" type="button">
            记下
          </button>
</div>
<p class="font-meta text-meta text-on-surface-faint mt-2 pl-0.5">回车保存 · 不需要切换页面</p>
</section>
<!-- 4. Search Bar -->
<section class="h-[44px] bg-surface-container rounded-[12px] flex items-center px-3 border border-transparent focus-within:border-outline focus-within:bg-surface">
<span class="material-symbols-outlined text-on-surface-variant mr-2 select-none" data-icon="search">search</span>
<input class="w-full bg-transparent border-0 p-0 font-body text-body text-[#121826] placeholder:text-on-surface-variant focus:ring-0 focus:outline-none" placeholder="搜索收集箱" type="search"/>
</section>
<!-- 5. Capture Card List -->
<section class="space-y-3 pt-0.5">
<!-- Card 1 -->
<article class="bg-surface rounded-[16px] border border-outline p-[14px]">
<p class="font-body text-[14px] font-medium leading-[21px] text-[#121826]">看到一句话：计划要短，执行要稳。</p>
<div class="flex justify-between items-center pt-2 mt-2 border-t border-outline">
<span class="font-meta text-meta text-on-surface-faint">2 分钟前</span>
<div class="flex items-center space-x-3">
<button class="font-meta text-meta font-medium text-primary active:opacity-75 transition-opacity" type="button">转任务</button>
<button class="font-meta text-meta font-medium text-danger active:opacity-75 transition-opacity" type="button">删除</button>
</div>
</div>
</article>
<!-- Card 2 -->
<article class="bg-surface rounded-[16px] border border-outline p-[14px]">
<p class="font-body text-[14px] font-medium leading-[21px] text-[#121826]">
<a class="text-primary underline underline-offset-2 break-all" href="https://stitch.withgoogle.com" rel="noopener noreferrer" target="_blank">https://stitch.withgoogle.com</a> 有空研究一下「用 AI 出原型」
          </p>
<div class="flex justify-between items-center pt-2 mt-2 border-t border-outline">
<span class="font-meta text-meta text-on-surface-faint">1 小时前</span>
<div class="flex items-center space-x-3">
<button class="font-meta text-meta font-medium text-primary active:opacity-75 transition-opacity" type="button">转任务</button>
<button class="font-meta text-meta font-medium text-danger active:opacity-75 transition-opacity" type="button">删除</button>
</div>
</div>
</article>
<!-- Card 3 -->
<article class="bg-surface rounded-[16px] border border-outline p-[14px]">
<p class="font-body text-[14px] font-medium leading-[21px] text-[#121826]">报销单要贴发票原件，财务说下周三之前。</p>
<div class="flex justify-between items-center pt-2 mt-2 border-t border-outline">
<span class="font-meta text-meta text-on-surface-faint">昨天 18:20</span>
<div class="flex items-center space-x-3">
<button class="font-meta text-meta font-medium text-primary active:opacity-75 transition-opacity" type="button">转任务</button>
<button class="font-meta text-meta font-medium text-danger active:opacity-75 transition-opacity" type="button">删除</button>
</div>
</div>
</article>
<!-- Card 4 -->
<article class="bg-surface rounded-[16px] border border-outline p-[14px]">
<p class="font-body text-[14px] font-medium leading-[21px] text-[#121826]">体检预约：空腹，早上 8:30 到前台取号。</p>
<div class="flex justify-between items-center pt-2 mt-2 border-t border-outline">
<span class="font-meta text-meta text-on-surface-faint">昨天 09:12</span>
<div class="flex items-center space-x-3">
<button class="font-meta text-meta font-medium text-primary active:opacity-75 transition-opacity" type="button">转任务</button>
<button class="font-meta text-meta font-medium text-danger active:opacity-75 transition-opacity" type="button">删除</button>
</div>
</div>
</article>

<nav class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-[358px] z-50 h-[64px] bg-surface rounded-full border border-outline flex justify-around items-center px-2 select-none">

<a class="flex flex-col items-center justify-center flex-1 py-1 text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95" href="#tasks">
<span class="material-symbols-outlined text-[20px]" data-icon="task_alt">task_alt</span>
<span class="font-meta text-meta mt-1">任务</span>
</a>
<!-- Tab 2: 收集箱 (Active) -->
<a class="flex flex-col items-center justify-center flex-1 py-1 text-primary font-semibold hover:bg-surface-container-low transition-colors active:scale-95" href="#inbox">
<div class="bg-primary-container text-primary rounded-full px-3 py-0.5 flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]" data-icon="inbox" data-weight="fill" style="font-variation-settings: 'FILL' 1;">inbox</span>
</div>
<span class="font-meta text-meta mt-0.5">收集箱</span>
</a>
<!-- Tab 3: 笔记 (Inactive) -->
<a class="flex flex-col items-center justify-center flex-1 py-1 text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95" href="#notes">
<span class="material-symbols-outlined text-[20px]" data-icon="description">description</span>
<span class="font-meta text-meta mt-1">笔记</span>

<a class="flex flex-col items-center justify-center flex-1 py-1 text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95" href="#settings">
<span class="material-symbols-outlined text-[20px]" data-icon="settings">settings</span>
<span class="font-meta text-meta mt-1">设置</span>
</a>
</nav>
</div>
