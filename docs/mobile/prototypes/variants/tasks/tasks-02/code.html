<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskDock 任务列表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#F3F5FA',
            charcoal: '#121826',
            slateMute: '#5B6478',
            faintSteel: '#8A93A6',
            hairline: '#E4E8F0',
            recessed: '#E9EEF8',
            signalBlue: '#3A5BEF',
            softBlue: '#E8ECFE',
            blueText: '#22307A',
            successGreen: '#0E8F63',
            successBg: '#E4F6EE',
            overdueAmber: '#A2620A',
            overdueBg: '#FBF0DC',
            dangerRed: '#C0332B',
            dangerBg: '#FBE7E5',
          },
          fontFamily: {
            sans: ['"Roboto Flex"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Roboto Flex', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F3F5FA;
      color: #121826;
      -webkit-font-smoothing: antialiased;
      width: 390px;
      margin: 0 auto;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#F3F5FA] text-[#121826] flex flex-col min-h-screen relative pb-[108px]">

  <!-- Android System Status Bar (approx 44px) -->
  <header class="w-full h-11 px-6 flex justify-between items-center text-xs font-semibold text-[#121826] select-none pt-1">
    <span class="tracking-tight text-[13px]">09:41</span>
    <div class="flex items-center gap-1.5 opacity-90">
      <span class="material-symbols-outlined text-[15px] font-bold">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-[15px] font-bold">wifi</span>
      <span class="material-symbols-outlined text-[17px] font-bold">battery_full</span>
    </div>
  </header>

  <!-- Main Content Container with 16dp horizontal padding -->
  <main class="px-4 flex-1 flex flex-col pt-2">

    <!-- Top Date Eyebrow & Page Title Row (NO top app bar, NO hamburger, NO TaskDock wordmark) -->
    <section class="mb-3.5">
      <div class="text-[12px] font-medium text-[#5B6478] mb-1">
        今天 11月8日 周六
      </div>
      <div class="flex items-center justify-between">
        <h1 class="text-[30px] font-[800] leading-tight text-[#121826] tracking-tight">
          任务
        </h1>
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-semibold bg-[#E8ECFE] text-[#3A5BEF]">
          本机模式
        </span>
      </div>
    </section>

    <!-- Stat Tiles: 4 equal tiles with 12px gap -->
    <section class="grid grid-cols-4 gap-3 mb-3.5">
      <!-- 待办 7 -->
      <div class="bg-white rounded-[16px] border border-[#E4E8F0] p-2.5 flex flex-col items-center justify-center text-center">
        <span class="text-[11px] font-semibold text-[#5B6478] mb-1">待办</span>
        <span class="text-[26px] font-[800] leading-none text-[#3A5BEF] tabular-nums">7</span>
      </div>
      <!-- 今天 3 -->
      <div class="bg-white rounded-[16px] border border-[#E4E8F0] p-2.5 flex flex-col items-center justify-center text-center">
        <span class="text-[11px] font-semibold text-[#5B6478] mb-1">今天</span>
        <span class="text-[26px] font-[800] leading-none text-[#3A5BEF] tabular-nums">3</span>
      </div>
      <!-- 已逾期 1 -->
      <div class="bg-white rounded-[16px] border border-[#E4E8F0] p-2.5 flex flex-col items-center justify-center text-center">
        <span class="text-[11px] font-semibold text-[#5B6478] mb-1">已逾期</span>
        <span class="text-[26px] font-[800] leading-none text-[#A2620A] tabular-nums">1</span>
      </div>
      <!-- 已完成 12 -->
      <div class="bg-white rounded-[16px] border border-[#E4E8F0] p-2.5 flex flex-col items-center justify-center text-center">
        <span class="text-[11px] font-semibold text-[#5B6478] mb-1">已完成</span>
        <span class="text-[26px] font-[800] leading-none text-[#0E8F63] tabular-nums">12</span>
      </div>
    </section>

    <!-- Filter Chips (Horizontally Scrollable, 32dp tall) -->
    <section class="flex items-center gap-2 overflow-x-auto no-scrollbar mb-3 py-0.5">
      <button type="button" class="h-8 px-4 rounded-full text-[12px] font-semibold bg-[#3A5BEF] text-white whitespace-nowrap flex-shrink-0 flex items-center justify-center">
        全部
      </button>
      <button type="button" class="h-8 px-4 rounded-full text-[12px] font-medium bg-transparent text-[#5B6478] border border-[#E4E8F0] whitespace-nowrap flex-shrink-0 flex items-center justify-center">
        未完成
      </button>
      <button type="button" class="h-8 px-4 rounded-full text-[12px] font-medium bg-transparent text-[#5B6478] border border-[#E4E8F0] whitespace-nowrap flex-shrink-0 flex items-center justify-center">
        今天
      </button>
      <button type="button" class="h-8 px-4 rounded-full text-[12px] font-medium bg-transparent text-[#5B6478] border border-[#E4E8F0] whitespace-nowrap flex-shrink-0 flex items-center justify-center">
        逾期
      </button>
      <button type="button" class="h-8 px-4 rounded-full text-[12px] font-medium bg-transparent text-[#5B6478] border border-[#E4E8F0] whitespace-nowrap flex-shrink-0 flex items-center justify-center">
        已完成
      </button>
    </section>

    <!-- Search Field (44dp tall, recessed #E9EEF8, 12px radius) -->
    <section class="mb-4">
      <div class="h-11 w-full bg-[#E9EEF8] rounded-[12px] px-3.5 flex items-center gap-2.5">
        <span class="material-symbols-outlined text-[#5B6478] text-[20px]">search</span>
        <input 
          type="text" 
          placeholder="搜索任务、标签、分类" 
          class="bg-transparent text-[13px] text-[#121826] placeholder-[#5B6478] outline-none w-full font-normal"
          readonly
        />
      </div>
    </section>

    <!-- Grouped Task List -->
    <div class="flex flex-col gap-4">

      <!-- Group 1: 今天（3） -->
      <section class="flex flex-col">
        <div class="flex items-center justify-between mb-2 px-0.5">
          <div class="flex items-center gap-1.5">
            <span class="w-[3px] h-[14px] bg-[#3A5BEF] rounded-full inline-block"></span>
            <span class="text-[13px] font-bold text-[#121826]">今天</span>
            <span class="text-[11px] font-semibold text-[#5B6478] bg-[#E9EEF8] px-1.5 py-0.5 rounded-full leading-none">3</span>
          </div>
          <span class="text-[11px] font-semibold text-[#A2620A]">1 项已逾期</span>
        </div>

        <div class="flex flex-col gap-2">
          <!-- Row 1: 写周报：Q4 目标复盘 -->
          <div class="bg-white rounded-[16px] border border-[#E4E8F0] p-3.5 flex items-start gap-3">
            <div class="w-5 h-5 rounded-full border-2 border-[#CBD5E1] mt-0.5 flex-shrink-0"></div>
            <div class="flex-1 min-w-0">
              <div class="text-[15px] font-semibold text-[#121826] leading-snug mb-2">
                写周报：Q4 目标复盘
              </div>
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="inline-flex items-center px-2 py-0.5 rounded-[6px] text-[11px] font-semibold bg-[#FBE7E5] text-[#C0332B]">
                  高优先级
                </span>
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-[6px] text-[11px] font-medium bg-[#E8ECFE] text-[#3A5BEF]">
                  <span class="material-symbols-outlined text-[13px]">schedule</span>
                  今天 18:00
                </span>
              </div>
            </div>
          </div>

          <!-- Row 2: 整理桌面端验收报告 -->
          <div class="bg-white rounded-[16px] border border-[#E4E8F0] p-3.5 flex items-start gap-3">
            <div class="w-5 h-5 rounded-full border-2 border-[#CBD5E1] mt-0.5 flex-shrink-0"></div>
            <div class="flex-1 min-w-0">
              <div class="text-[15px] font-semibold text-[#121826] leading-snug mb-2">
                整理桌面端验收报告
              </div>
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-[6px] text-[11px] font-semibold bg-[#FBF0DC] text-[#A2620A]">
                  <span class="material-symbols-outlined text-[13px]">error</span>
                  已逾期 2 天
                </span>
                <span class="inline-flex items-center px-2 py-0.5 rounded-[6px] text-[11px] font-medium bg-[#F3F5FA] text-[#5B6478]">
                  工作
                </span>
              </div>
            </div>
          </div>

          <!-- Row 3: 给妈妈打电话 -->
          <div class="bg-white rounded-[16px] border border-[#E4E8F0] p-3.5 flex items-start gap-3">
            <div class="w-5 h-5 rounded-full border-2 border-[#CBD5E1] mt-0.5 flex-shrink-0"></div>
            <div class="flex-1 min-w-0">
              <div class="text-[15px] font-semibold text-[#121826] leading-snug mb-1">
                给妈妈打电话
              </div>
              <div class="text-[12px] font-normal text-[#8A93A6]">
                无截止时间
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Group 2: 本周（2） -->
      <section class="flex flex-col">
        <div class="flex items-center justify-between mb-2 px-0.5">
          <div class="flex items-center gap-1.5">
            <span class="w-[3px] h-[14px] bg-[#3A5BEF] rounded-full inline-block"></span>
            <span class="text-[13px] font-bold text-[#121826]">本周</span>
            <span class="text-[11px] font-semibold text-[#5B6478] bg-[#E9EEF8] px-1.5 py-0.5 rounded-full leading-none">2</span>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <!-- Row 1: 预约体检 -->
          <div class="bg-white rounded-[16px] border border-[#E4E8F0] p-3.5 flex items-start gap-3">
            <div class="w-5 h-5 rounded-full border-2 border-[#CBD5E1] mt-0.5 flex-shrink-0"></div>
            <div class="flex-1 min-w-0">
              <div class="text-[15px] font-semibold text-[#121826] leading-snug mb-2">
                预约体检
              </div>
              <div>
                <span class="inline-flex items-center px-2 py-0.5 rounded-[6px] text-[11px] font-medium bg-[#F3F5FA] text-[#5B6478]">
                  周三
                </span>
              </div>
            </div>
          </div>

          <!-- Row 2: 提交报销单 -->
          <div class="bg-white rounded-[16px] border border-[#E4E8F0] p-3.5 flex items-start gap-3">
            <div class="w-5 h-5 rounded-full border-2 border-[#CBD5E1] mt-0.5 flex-shrink-0"></div>
            <div class="flex-1 min-w-0">
              <div class="text-[15px] font-semibold text-[#121826] leading-snug mb-2">
                提交报销单
              </div>
              <div>
                <span class="inline-flex items-center px-2 py-0.5 rounded-[6px] text-[11px] font-medium bg-[#F3F5FA] text-[#5B6478]">
                  周五
                </span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Group 3: 以后（1） -->
      <section class="flex flex-col">
        <div class="flex items-center justify-between mb-2 px-0.5">
          <div class="flex items-center gap-1.5">
            <span class="w-[3px] h-[14px] bg-[#3A5BEF] rounded-full inline-block"></span>
            <span class="text-[13px] font-bold text-[#121826]">以后</span>
            <span class="text-[11px] font-semibold text-[#5B6478] bg-[#E9EEF8] px-1.5 py-0.5 rounded-full leading-none">1</span>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <!-- Row: 学习 Rust 异步运行时 -->
          <div class="bg-white rounded-[16px] border border-[#E4E8F0] p-3.5 flex items-start gap-3">
            <div class="w-5 h-5 rounded-full border-2 border-[#CBD5E1] mt-0.5 flex-shrink-0"></div>
            <div class="flex-1 min-w-0">
              <div class="text-[15px] font-semibold text-[#121826] leading-snug">
                学习 Rust 异步运行时
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Group 4: 无日期（1） -->
      <section class="flex flex-col mb-4">
        <div class="flex items-center justify-between mb-2 px-0.5">
          <div class="flex items-center gap-1.5">
            <span class="w-[3px] h-[14px] bg-[#3A5BEF] rounded-full inline-block"></span>
            <span class="text-[13px] font-bold text-[#121826]">无日期</span>
            <span class="text-[11px] font-semibold text-[#5B6478] bg-[#E9EEF8] px-1.5 py-0.5 rounded-full leading-none">1</span>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <!-- Row: 读完《深度工作》第三章 -->
          <div class="bg-white rounded-[16px] border border-[#E4E8F0] p-3.5 flex items-start gap-3">
            <div class="w-5 h-5 rounded-full border-2 border-[#CBD5E1] mt-0.5 flex-shrink-0"></div>
            <div class="flex-1 min-w-0">
              <div class="text-[15px] font-semibold text-[#121826] leading-snug">
                读完《深度工作》第三章
              </div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- 58dp Circular Blue FAB sitting above the tab bar at bottom right -->
  <aside class="fixed bottom-[88px] right-4 z-40">
    <button type="button" aria-label="新增任务" class="w-[58px] h-[58px] rounded-full bg-[#3A5BEF] text-white flex items-center justify-center active:scale-95 transition-transform" style="box-shadow: 0 4px 14px rgba(58, 91, 239, 0.35);">
      <span class="material-symbols-outlined text-[30px] font-bold">add</span>
    </button>
  </aside>

  <!-- Floating Rounded Tab Bar: 64dp tall, inset 16dp from edges -->
  <nav class="fixed bottom-3 left-4 right-4 z-30 h-16 bg-white rounded-full border border-[#E4E8F0] flex items-center justify-around px-2" style="box-shadow: 0 4px 20px rgba(18, 24, 38, 0.08);">
    
    <!-- Tab 1: 任务 (Active) -->
    <a href="#" class="flex flex-col items-center justify-center flex-1 h-full select-none text-[#3A5BEF]">
      <div class="px-4 py-1 rounded-full bg-[#E8ECFE] flex items-center justify-center mb-0.5">
        <span class="material-symbols-outlined text-[20px] font-semibold">check_circle</span>
      </div>
      <span class="text-[11px] font-bold leading-none">任务</span>
    </a>

    <!-- Tab 2: 收集箱 -->
    <a href="#" class="flex flex-col items-center justify-center flex-1 h-full select-none text-[#5B6478]">
      <div class="px-4 py-1 flex items-center justify-center mb-0.5">
        <span class="material-symbols-outlined text-[20px]">inbox</span>
      </div>
      <span class="text-[11px] font-medium leading-none">收集箱</span>
    </a>

    <!-- Tab 3: 笔记 -->
    <a href="#" class="flex flex-col items-center justify-center flex-1 h-full select-none text-[#5B6478]">
      <div class="px-4 py-1 flex items-center justify-center mb-0.5">
        <span class="material-symbols-outlined text-[20px]">description</span>
      </div>
      <span class="text-[11px] font-medium leading-none">笔记</span>
    </a>

    <!-- Tab 4: 设置 -->
    <a href="#" class="flex flex-col items-center justify-center flex-1 h-full select-none text-[#5B6478]">
      <div class="px-4 py-1 flex items-center justify-center mb-0.5">
        <span class="material-symbols-outlined text-[20px]">settings</span>
      </div>
      <span class="text-[11px] font-medium leading-none">设置</span>
    </a>

  </nav>

  <!-- Android Gesture Navigation Inset Bar -->
  <footer class="fixed bottom-0 left-0 right-0 h-3 flex items-center justify-center pointer-events-none z-50">
    <div class="w-32 h-1 bg-[#121826] opacity-20 rounded-full"></div>
  </footer>

</body>
</html>
