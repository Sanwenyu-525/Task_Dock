<script>
    // Lightweight interaction for checkboxes without framework overhead
    document.querySelectorAll('button[aria-label="标记完成"]').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const isChecked = this.getAttribute('data-checked') === 'true';
        if (!isChecked) {
          this.setAttribute('data-checked', 'true');
          this.classList.remove('border-outline');
          this.classList.add('bg-primary', 'border-primary', 'text-white');
          this.innerHTML = '<span class="material-symbols-outlined text-[14px]">check</span>';
          const cardText = this.parentElement.querySelector('p');
          if (cardText) {
            cardText.classList.add('line-through', 'text-on-surface-faint');
          }
        } else {
          this.setAttribute('data-checked', 'false');
          this.classList.add('border-outline');
          this.classList.remove('bg-primary', 'border-primary', 'text-white');
          this.innerHTML = '';
          const cardText = this.parentElement.querySelector('p');
          if (cardText) {
            cardText.classList.remove('line-through', 'text-on-surface-faint');
          }
        }
      });
    });
  </script>
