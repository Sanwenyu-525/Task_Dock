<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskDock 设置 (移动端)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'canvas-fog': '#F3F5FA',
            'pure-surface': '#FFFFFF',
            'recessed-band': '#E9EEF8',
            'charcoal-navy': '#121826',
            'slate-mute': '#5B6478',
            'faint-steel': '#8A93A6',
            'hairline': '#E4E8F0',
            'signal-blue': '#3A5BEF',
            'soft-blue': '#E8ECFE',
            'success-green': '#0E8F63',
            'overdue-amber': '#A2620A',
            'danger-red': '#C0332B',
          },
          fontFamily: {
            sans: ['"Roboto Flex"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      background-color: #F3F5FA;
      font-family: 'Roboto Flex', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #121826;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background-color: #F3F5FA;
      position: relative;
      padding-bottom: 100px;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-canvas-fog">
  <div class="mobile-frame flex flex-col">
    <!-- Android Status Bar -->
    <div class="h-11 px-5 flex items-center justify-between text-charcoal-navy font-semibold text-xs tracking-tight select-none pt-1">
      <span>09:41</span>
      <div class="flex items-center space-x-1.5 opacity-90">
        <span class="material-symbols-outlined text-[17px] leading-none">signal_cellular_4_bar</span>
        <span class="material-symbols-outlined text-[17px] leading-none">wifi</span>
        <span class="material-symbols-outlined text-[19px] leading-none">battery_full</span>
      </div>
    </div>

    <!-- Header Section (Starts directly with page title, no app bar/wordmark) -->
    <header class="px-4 pt-3 pb-4">
      <h1 class="text-[30px] font-[800] leading-9 tracking-tight text-charcoal-navy m-0">设置</h1>
      <p class="text-[12px] font-normal leading-4 text-slate-mute mt-1 mb-0">仅本机 · 不连接桌面端</p>
    </header>

    <!-- Data Summary Row -->
    <section class="px-4 mb-5">
      <div class="grid grid-cols-3 gap-3">
        <!-- Tile 1 -->
        <div class="bg-pure-surface border border-hairline rounded-[16px] py-3.5 flex flex-col items-center justify-center">
          <span class="text-[26px] font-[800] leading-7 text-signal-blue tracking-tight font-sans">24</span>
          <span class="text-[11px] font-[600] leading-4 text-slate-mute mt-1">任务</span>
        </div>
        <!-- Tile 2 -->
        <div class="bg-pure-surface border border-hairline rounded-[16px] py-3.5 flex flex-col items-center justify-center">
          <span class="text-[26px] font-[800] leading-7 text-signal-blue tracking-tight font-sans">6</span>
          <span class="text-[11px] font-[600] leading-4 text-slate-mute mt-1">收集</span>
        </div>
        <!-- Tile 3 -->
        <div class="bg-pure-surface border border-hairline rounded-[16px] py-3.5 flex flex-col items-center justify-center">
          <span class="text-[26px] font-[800] leading-7 text-signal-blue tracking-tight font-sans">12</span>
          <span class="text-[11px] font-[600] leading-4 text-slate-mute mt-1">已完成</span>
        </div>
      </div>
    </section>

    <!-- Content Sections -->
    <div class="space-y-5 px-4">

      <!-- Section: 外观 -->
      <section>
        <div class="flex items-center gap-2 mb-2 px-0.5">
          <div class="w-1 h-3.5 bg-signal-blue rounded-full"></div>
          <h2 class="text-[13px] font-[700] text-charcoal-navy tracking-tight">外观</h2>
        </div>
        
        <div class="bg-pure-surface border border-hairline rounded-[20px] p-3.5 space-y-3">
          <!-- Segmented Control -->
          <div class="bg-recessed-band p-1 rounded-[12px] grid grid-cols-3 gap-1">
            <button class="bg-signal-blue text-white text-[12px] font-[600] py-1.5 rounded-[9px] shadow-none transition-colors text-center">
              跟随系统
            </button>
            <button class="text-slate-mute text-[12px] font-[500] py-1.5 rounded-[9px] hover:text-charcoal-navy transition-colors text-center">
              浅色
            </button>
            <button class="text-slate-mute text-[12px] font-[500] py-1.5 rounded-[9px] hover:text-charcoal-navy transition-colors text-center">
              深色
            </button>
          </div>

          <!-- Preview Card -->
          <div class="border border-hairline rounded-[14px] p-3 bg-canvas-fog/50 flex items-center justify-between">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-4 h-4 rounded-full border-[1.5px] border-signal-blue flex items-center justify-center bg-white shrink-0">
                <div class="w-2 h-2 rounded-full bg-signal-blue"></div>
              </div>
              <span class="text-[13px] font-[600] text-charcoal-navy truncate">写周报：Q4 目标复盘</span>
            </div>
            <span class="text-[11px] font-[600] text-signal-blue bg-soft-blue px-2.5 py-0.5 rounded-full shrink-0 ml-2">
              今天 18:00
            </span>
          </div>
        </div>
      </section>

      <!-- Section: 提醒 -->
      <section>
        <div class="flex items-center gap-2 mb-2 px-0.5">
          <div class="w-1 h-3.5 bg-signal-blue rounded-full"></div>
          <h2 class="text-[13px] font-[700] text-charcoal-navy tracking-tight">提醒</h2>
        </div>

        <div class="bg-pure-surface border border-hairline rounded-[20px] p-3.5 space-y-3">
          <div class="divide-y divide-hairline">
            <!-- Row: 通知权限 -->
            <div class="py-2.5 flex items-center justify-between">
              <span class="text-[13px] font-[500] text-charcoal-navy">通知权限</span>
              <div class="flex items-center gap-1.5">
                <div class="w-2 h-2 rounded-full bg-success-green"></div>
                <span class="text-[12px] font-[600] text-success-green">已允许</span>
              </div>
            </div>
            <!-- Row: 提前提醒 -->
            <div class="py-2.5 flex items-center justify-between">
              <span class="text-[13px] font-[500] text-charcoal-navy">提前提醒</span>
              <span class="text-[12px] font-normal text-slate-mute">默认</span>
            </div>
          </div>

          <!-- Secondary Button -->
          <button class="w-full py-2.5 border border-hairline bg-transparent hover:bg-canvas-fog active:scale-[0.99] transition-all rounded-[12px] text-[13px] font-[600] text-signal-blue text-center">
            发送测试通知
          </button>
        </div>
      </section>

      <!-- Section: 本地数据 -->
      <section>
        <div class="flex items-center gap-2 mb-2 px-0.5">
          <div class="w-1 h-3.5 bg-signal-blue rounded-full"></div>
          <h2 class="text-[13px] font-[700] text-charcoal-navy tracking-tight">本地数据</h2>
        </div>

        <div class="bg-pure-surface border border-hairline rounded-[20px] px-3.5 py-1 divide-y divide-hairline">
          <div class="py-3 flex items-center justify-between">
            <span class="text-[13px] font-[500] text-charcoal-navy">数据库</span>
            <span class="text-[12px] font-normal text-slate-mute font-mono">SQLite v2 · WAL</span>
          </div>
          <div class="py-3 flex items-center justify-between">
            <span class="text-[13px] font-[500] text-charcoal-navy">已排期提醒</span>
            <span class="text-[12px] font-normal text-slate-mute">3 条</span>
          </div>
          <div class="py-3 flex items-center justify-between">
            <span class="text-[13px] font-[500] text-charcoal-navy">存储占用</span>
            <span class="text-[12px] font-normal text-slate-mute">1.2 MB</span>
          </div>
        </div>
      </section>

      <!-- Section: 关于 -->
      <section>
        <div class="flex items-center gap-2 mb-2 px-0.5">
          <div class="w-1 h-3.5 bg-signal-blue rounded-full"></div>
          <h2 class="text-[13px] font-[700] text-charcoal-navy tracking-tight">关于</h2>
        </div>

        <div class="bg-pure-surface border border-hairline rounded-[20px] px-3.5 py-1 divide-y divide-hairline">
          <div class="py-3 flex items-center justify-between">
            <span class="text-[13px] font-[500] text-charcoal-navy">版本</span>
            <span class="text-[12px] font-normal text-slate-mute font-mono">0.1.2</span>
          </div>
          <div class="py-3 flex items-center justify-between">
            <span class="text-[13px] font-[500] text-charcoal-navy">数据范围</span>
            <span class="text-[12px] font-normal text-slate-mute">仅本机</span>
          </div>
          <div class="py-3 flex items-center justify-between cursor-pointer">
            <span class="text-[13px] font-[500] text-charcoal-navy">开源许可</span>
            <span class="material-symbols-outlined text-[18px] text-faint-steel leading-none">chevron_right</span>
          </div>
        </div>
      </section>
    </div>

    <!-- Floating Tab Bar (64dp tall, inset 16dp, 4 tabs) -->
    <nav class="fixed bottom-4 left-4 right-4 max-w-[358px] mx-auto h-16 bg-pure-surface/95 backdrop-blur-md border border-hairline rounded-[24px] shadow-sm flex items-center justify-around px-2 z-50">
      <!-- Tab 1: 任务 -->
      <a href="#" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-mute hover:text-charcoal-navy transition-colors">
        <span class="material-symbols-outlined text-[22px] leading-none">check_circle</span>
        <span class="text-[11px] font-[500] mt-1">任务</span>
      </a>

      <!-- Tab 2: 收集箱 -->
      <a href="#" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-mute hover:text-charcoal-navy transition-colors">
        <span class="material-symbols-outlined text-[22px] leading-none">inbox</span>
        <span class="text-[11px] font-[500] mt-1">收集箱</span>
      </a>

      <!-- Tab 3: 笔记 -->
      <a href="#" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-mute hover:text-charcoal-navy transition-colors">
        <span class="material-symbols-outlined text-[22px] leading-none">description</span>
        <span class="text-[11px] font-[500] mt-1">笔记</span>
      </a>

      <!-- Tab 4: 设置 (Active) -->
      <a href="#" class="flex flex-col items-center justify-center flex-1 py-1 text-signal-blue">
        <div class="bg-soft-blue px-3 py-1 rounded-full flex flex-col items-center">
          <span class="material-symbols-outlined filled text-[20px] leading-none text-signal-blue">settings</span>
          <span class="text-[11px] font-[700] mt-0.5 text-signal-blue">设置</span>
        </div>
      </a>
    </nav>
  </div>
</body>
</html>
