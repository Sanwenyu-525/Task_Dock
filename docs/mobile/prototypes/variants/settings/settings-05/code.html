<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskDock 设置 (移动端)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#F3F5FA',
            charcoal: '#121826',
            slateMute: '#5B6478',
            faintSteel: '#8A93A6',
            hairline: '#E4E8F0',
            recessed: '#E9EEF8',
            signalBlue: '#3A5BEF',
            softBlue: '#E8ECFE',
            successGreen: '#0E8F63',
            overdueAmber: '#A2620A',
            dangerRed: '#C0332B'
          },
          fontFamily: {
            sans: ['"Roboto Flex"', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Roboto Flex', system-ui, -apple-system, sans-serif;
      background-color: #F3F5FA;
      color: #121826;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 450, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill-active {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-[#F3F5FA] min-h-screen text-[#121826] flex justify-center selection:bg-signalBlue selection:text-white">
  <!-- Mobile Viewport 390px -->
  <div class="w-full max-w-[390px] min-h-screen flex flex-col relative pb-[108px] bg-[#F3F5FA]">
    
    <!-- Android Status Bar (Quiet, clean) -->
    <div class="w-full h-11 px-6 flex items-center justify-between text-[#121826] text-[13px] font-semibold select-none pt-1">
      <span class="tracking-tight">09:41</span>
      <div class="flex items-center gap-2 text-slate-700">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.5-.47 2.89-1.28 4.04L12 19.38l-5.72-3.34C5.47 14.89 5 13.5 5 12c0-3.87 3.13-7 7-7z"/></svg>
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.32c3.48 0 6.64 1.34 9.02 3.53L12 19.4 2.98 10.85C5.36 8.66 8.52 7.32 12 7.32z"/></svg>
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M17 4h-3V2h-4v2H7v18h10V4zm-2 16H9V6h6v14z"/></svg>
      </div>
    </div>

    <!-- Header / Title Area (No Appbar, directly page title) -->
    <header class="px-4 pt-3 pb-4">
      <h1 class="text-[30px] font-[800] leading-[36px] tracking-[-0.02em] text-[#121826]">设置</h1>
      <p class="text-[12px] font-normal leading-[16px] text-[#5B6478] mt-1">仅本机 · 不连接桌面端</p>
    </header>

    <!-- Data Summary Row: 3 equal tiles, 12px gap, 16px radius, hairline border -->
    <section class="px-4 mb-6">
      <div class="grid grid-cols-3 gap-3">
        <!-- Tile 1 -->
        <div class="bg-white rounded-[16px] p-3.5 border border-[#E4E8F0] flex flex-col justify-between">
          <span class="text-[26px] font-[800] leading-[30px] text-[#3A5BEF] tabular-nums">24</span>
          <span class="text-[11px] font-[600] leading-[14px] text-[#5B6478] mt-2 tracking-[0.02em]">任务</span>
        </div>
        <!-- Tile 2 -->
        <div class="bg-white rounded-[16px] p-3.5 border border-[#E4E8F0] flex flex-col justify-between">
          <span class="text-[26px] font-[800] leading-[30px] text-[#3A5BEF] tabular-nums">6</span>
          <span class="text-[11px] font-[600] leading-[14px] text-[#5B6478] mt-2 tracking-[0.02em]">收集</span>
        </div>
        <!-- Tile 3 -->
        <div class="bg-white rounded-[16px] p-3.5 border border-[#E4E8F0] flex flex-col justify-between">
          <span class="text-[26px] font-[800] leading-[30px] text-[#0E8F63] tabular-nums">12</span>
          <span class="text-[11px] font-[600] leading-[14px] text-[#5B6478] mt-2 tracking-[0.02em]">已完成</span>
        </div>
      </div>
    </section>

    <!-- Settings Content Group -->
    <main class="px-4 space-y-6">

      <!-- Section: 外观 -->
      <section>
        <div class="flex items-center gap-2 mb-2.5">
          <div class="w-[3px] h-[14px] bg-[#3A5BEF] rounded-full"></div>
          <h2 class="text-[13px] font-[700] text-[#121826] tracking-tight">外观</h2>
          <div class="flex-1 h-[1px] bg-[#E4E8F0] ml-1"></div>
        </div>

        <div class="bg-white rounded-[20px] p-3.5 border border-[#E4E8F0] space-y-3">
          <!-- Segmented control: 3 options with 12px radius track -->
          <div class="bg-[#E9EEF8] p-1 rounded-[12px] grid grid-cols-3 gap-1">
            <button class="bg-[#3A5BEF] text-white text-[12px] font-[600] py-2 rounded-[9px] text-center transition-all">
              跟随系统
            </button>
            <button class="text-[#5B6478] hover:text-[#121826] text-[12px] font-[500] py-2 rounded-[9px] text-center transition-colors">
              浅色
            </button>
            <button class="text-[#5B6478] hover:text-[#121826] text-[12px] font-[500] py-2 rounded-[9px] text-center transition-colors">
              深色
            </button>
          </div>

          <!-- Small Preview Card: mini task row preview -->
          <div class="bg-[#F8FAFD] rounded-[14px] p-3 border border-[#E4E8F0] flex items-center justify-between">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-5 h-5 rounded-full border-2 border-[#3A5BEF] flex items-center justify-center flex-shrink-0">
                <div class="w-2.5 h-2.5 rounded-full bg-[#3A5BEF]"></div>
              </div>
              <span class="text-[13px] font-[600] text-[#121826] truncate">写周报：Q4 目标复盘</span>
            </div>
            <span class="inline-flex items-center px-2 py-0.5 rounded-[9999px] bg-[#E8ECFE] text-[#3A5BEF] text-[11px] font-[600] flex-shrink-0">
              今天 18:00
            </span>
          </div>
        </div>
      </section>

      <!-- Section: 提醒 -->
      <section>
        <div class="flex items-center gap-2 mb-2.5">
          <div class="w-[3px] h-[14px] bg-[#3A5BEF] rounded-full"></div>
          <h2 class="text-[13px] font-[700] text-[#121826] tracking-tight">提醒</h2>
          <div class="flex-1 h-[1px] bg-[#E4E8F0] ml-1"></div>
        </div>

        <div class="bg-white rounded-[20px] border border-[#E4E8F0] overflow-hidden">
          <!-- Row 1: 通知权限 -->
          <div class="px-4 py-3.5 flex items-center justify-between border-b border-[#E4E8F0]">
            <span class="text-[14px] font-[500] text-[#121826]">通知权限</span>
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-[#0E8F63]"></span>
              <span class="text-[13px] font-[600] text-[#0E8F63]">已允许</span>
            </div>
          </div>

          <!-- Row 2: 提前提醒 -->
          <div class="px-4 py-3.5 flex items-center justify-between border-b border-[#E4E8F0]">
            <span class="text-[14px] font-[500] text-[#121826]">提前提醒</span>
            <span class="text-[13px] font-[400] text-[#5B6478]">默认</span>
          </div>

          <!-- Row 3: Secondary button "发送测试通知" -->
          <div class="p-3">
            <button class="w-full py-2.5 px-4 rounded-[12px] border border-[#3A5BEF] text-[#3A5BEF] text-[13px] font-[600] text-center hover:bg-[#E8ECFE]/50 active:scale-[0.99] transition-all">
              发送测试通知
            </button>
          </div>
        </div>
      </section>

      <!-- Section: 本地数据 -->
      <section>
        <div class="flex items-center gap-2 mb-2.5">
          <div class="w-[3px] h-[14px] bg-[#3A5BEF] rounded-full"></div>
          <h2 class="text-[13px] font-[700] text-[#121826] tracking-tight">本地数据</h2>
          <div class="flex-1 h-[1px] bg-[#E4E8F0] ml-1"></div>
        </div>

        <div class="bg-white rounded-[20px] border border-[#E4E8F0] divide-y divide-[#E4E8F0] overflow-hidden">
          <div class="px-4 py-3.5 flex items-center justify-between">
            <span class="text-[14px] font-[500] text-[#121826]">数据库</span>
            <span class="text-[13px] font-[400] text-[#5B6478]">SQLite v2 · WAL</span>
          </div>
          <div class="px-4 py-3.5 flex items-center justify-between">
            <span class="text-[14px] font-[500] text-[#121826]">已排期提醒</span>
            <span class="text-[13px] font-[400] text-[#5B6478]">3 条</span>
          </div>
          <div class="px-4 py-3.5 flex items-center justify-between">
            <span class="text-[14px] font-[500] text-[#121826]">存储占用</span>
            <span class="text-[13px] font-[400] text-[#5B6478]">1.2 MB</span>
          </div>
        </div>
      </section>

      <!-- Section: 关于 -->
      <section>
        <div class="flex items-center gap-2 mb-2.5">
          <div class="w-[3px] h-[14px] bg-[#3A5BEF] rounded-full"></div>
          <h2 class="text-[13px] font-[700] text-[#121826] tracking-tight">关于</h2>
          <div class="flex-1 h-[1px] bg-[#E4E8F0] ml-1"></div>
        </div>

        <div class="bg-white rounded-[20px] border border-[#E4E8F0] divide-y divide-[#E4E8F0] overflow-hidden">
          <div class="px-4 py-3.5 flex items-center justify-between">
            <span class="text-[14px] font-[500] text-[#121826]">版本</span>
            <span class="text-[13px] font-[400] text-[#5B6478]">0.1.2</span>
          </div>
          <div class="px-4 py-3.5 flex items-center justify-between">
            <span class="text-[14px] font-[500] text-[#121826]">数据范围</span>
            <span class="text-[13px] font-[400] text-[#5B6478]">仅本机</span>
          </div>
          <div class="px-4 py-3.5 flex items-center justify-between active:bg-[#F3F5FA] transition-colors cursor-pointer">
            <span class="text-[14px] font-[500] text-[#121826]">开源许可</span>
            <span class="material-symbols-outlined text-[#8A93A6] text-[18px]">chevron_right</span>
          </div>
        </div>
      </section>

    </main>

    <!-- Bottom Floating Tab Bar: 64dp tall, inset 16dp, 4 tabs (active: 设置) -->
    <nav class="fixed bottom-3 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-[358px] h-16 bg-white/95 backdrop-blur-md rounded-[9999px] border border-[#E4E8F0] shadow-sm flex items-center justify-around px-2 z-50">
      <!-- Tab 1: 任务 -->
      <button class="flex flex-col items-center justify-center w-16 h-12 rounded-full text-[#5B6478] hover:text-[#121826] transition-colors">
        <span class="material-symbols-outlined text-[20px]">task_alt</span>
        <span class="text-[10px] font-[500] mt-0.5">任务</span>
      </button>

      <!-- Tab 2: 收集箱 -->
      <button class="flex flex-col items-center justify-center w-16 h-12 rounded-full text-[#5B6478] hover:text-[#121826] transition-colors">
        <span class="material-symbols-outlined text-[20px]">inbox</span>
        <span class="text-[10px] font-[500] mt-0.5">收集箱</span>
      </button>

      <!-- Tab 3: 笔记 -->
      <button class="flex flex-col items-center justify-center w-16 h-12 rounded-full text-[#5B6478] hover:text-[#121826] transition-colors">
        <span class="material-symbols-outlined text-[20px]">description</span>
        <span class="text-[10px] font-[500] mt-0.5">笔记</span>
      </button>

      <!-- Tab 4: 设置 (Active with blue pill indicator) -->
      <button class="flex flex-col items-center justify-center w-16 h-12 rounded-[24px] bg-[#E8ECFE] text-[#3A5BEF] transition-all">
        <span class="material-symbols-outlined fill-active text-[20px]">settings</span>
        <span class="text-[10px] font-[700] mt-0.5">设置</span>
      </button>
    </nav>

  </div>
</body>
</html>
